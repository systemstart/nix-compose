# Release notes, generated by git-cliff and handed to goreleaser.
#
# Why not goreleaser's own changelog: it models a commit as (sha, subject,
# author) and never parses conventional-commit footers, so a BREAKING CHANGE
# description could not reach the release page -- only the subject line could.
# git-cliff parses the commit properly and exposes commit.breaking_description.
#
# This file owns the *whole* body: header, changelog and footer. goreleaser's
# release.header/footer are deliberately absent so there is exactly one source
# of truth, and because `--release-notes` is documented as replacing the body
# rather than composing with them.
#
# `make release` renders this; `make release-notes` previews it without
# releasing anything.

[changelog]
header = """
Container orchestration over CRI, with service images built straight from
Nix closures instead of Dockerfiles.

`nix-compose` speaks CRI gRPC directly to containerd or CRI-O — no daemon,
no compose file, nothing shelling out to another tool. A service can name a
*package* instead of a registry image, and its image is built from that
package's Nix closure and imported into the runtime: no Dockerfile, nothing
pushed or pulled.

## Install

```sh
nix run github:systemstart/nix-compose -- up -d
# or
go install github.com/systemstart/nix-compose/cmd/nix-compose@latest
```

Or download an archive below. Linux only; needs containerd or CRI-O.
Run `nix-compose doctor` first — it checks every prerequisite and each
finding carries its fix.

## Before you adopt it

Read [docs/limitations.md](https://github.com/systemstart/nix-compose/blob/main/docs/limitations.md)
— a deliberately complete account of what does not work, not a marketing
document. The changes in this release are listed below.

## Changelog
"""

# The `<!-- N -->` prefixes exist only to order the groups; striptags removes
# them from the rendered heading.
#
# raw_message, not message: git-cliff strips the conventional-commit type from
# `message`, which reads fine under "Features" but loses the build/ci/chore
# distinction under "Other changes". The subject is shown whole.
#
# `trim` is off below because it strips the leading indent that nests the
# Breaking line under its commit.
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.raw_message | split(pat="\\n") | first | trim }}
{%- if commit.breaking and commit.breaking_description %}
  - **Breaking:** {{ commit.breaking_description | trim }}
{%- endif %}
{%- endfor %}
{% endfor %}
"""

footer = """

---

While the major version is 0, the `nix-compose.yaml` schema and the CLI
surface may still change between minor releases.

Archives are attested with build provenance; verify with
`gh attestation verify <archive> --repo systemstart/nix-compose`.
"""

trim = false

[git]
conventional_commits = true
# Keep non-conventional commits rather than dropping them silently: an
# unlabelled commit still shipped, and a reader deserves to see it.
filter_unconventional = false
# A breaking commit is never filtered out by the parsers below.
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "oldest"

# First match wins, so the breaking rule has to come first: a `feat!:` belongs
# under Breaking changes, not Features. Type-based *skips* are deliberately
# few -- dropping whole types once emptied a changelog completely (v0.2.0
# shipped with a bare `## Changelog` heading and nothing under it).
commit_parsers = [
  { message = "^Merge pull request", skip = true },
  { message = "^chore: release", skip = true },
  { message = "^.*!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Fixes" },
  { message = ".*", group = "<!-- 3 -->Other changes" },
]

[bump]
# gsemver still computes the version (see `make release-tag`). If that ever
# moves to git-cliff, note the defaults differ: git-cliff bumps *major* on a
# breaking change even from 0.x, where gsemver bumps minor.
breaking_always_bump_major = false
features_always_bump_minor = true
