name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Lint
        run: nix develop --command make lint

      - name: Test
        run: nix develop --command make test

      - name: Build
        run: nix develop --command make build

  # The unit suite covers everything that does not need a container runtime.
  # Integration tests need a CRI socket, which a stock GitHub runner does not
  # have — see docs/running-in-ci.md. They run in the self-hosted pipeline for
  # now; this job at least proves the flake and the build are healthy on a
  # machine that is not ours.
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Flake check
        run: nix flake check --all-systems || nix flake check
