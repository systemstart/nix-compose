services:
  web:
    image: nginx:latest
    ports:
      - "8080:80"
    environment:
      BACKEND_URL: http://api:3000
      NGINX_HOST: localhost
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./html:/usr/share/nginx/html:ro
    x-nix-compose:
      serviceInfo:
        defaultExec:
          - bash
  api:
    image: node:20-slim
    command:
      - node
      - server.js
    ports:
      - "3000:3000"
    environment:
      DB_HOST: localhost
      NODE_ENV: production
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3000/health
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - api-data:/data
      - ./config:/app/config:ro
    x-nix-compose:
      serviceInfo:
        defaultExec:
          - sh
          - -c
          - node
networks:
  default:
    name: two-services_default
volumes:
  api-data: {}
