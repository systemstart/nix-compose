version: 2

builds:
  - main: ./cmd/nix-compose
    binary: nix-compose
    ldflags:
      - -X main.version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: ['tar.gz']
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  # Short SHAs; the default prints all 40 characters, which drowns the subject.
  abbrev: 7
  # goreleaser has no notion of a breaking change, so it is a group like any
  # other, matched on the conventional-commit `!`. It sits first because a
  # reader deciding whether to upgrade needs it before anything else.
  #
  # Note the changelog renders commit *subjects* only — never bodies. A
  # BREAKING-CHANGE footer will not appear here, so the subject has to carry
  # enough, and the specifics belong in `release.header` for that release.
  groups:
    - title: Breaking changes
      regexp: '^.*?[[:word:]]+(\([[:word:]]+\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Other changes
      order: 999
  filters:
    # Merge commits only. Type-based excludes (docs/test/ci/chore) are
    # deliberately absent: they emptied the changelog entirely on a release that
    # contained only those — v0.2.0 shipped with a bare `## Changelog` heading
    # and nothing under it. Grouping keeps the noise out of the way instead:
    # anything that is not breaking, a feat or a fix lands under "Other
    # changes", where it is visible but last.
    #
    # This history is linear today, so the filter is inert; it is here so the
    # two projects' release configs stay identical in shape.
    exclude:
      - "^Merge pull request"

release:
  github:
    owner: systemstart
    name: nix-compose
  # "auto" marks a release as a pre-release only when the tag carries a
  # semver pre-release identifier (v0.2.0-rc1). A plain v0.1.0 is a full
  # release; tag an -rc if you want otherwise.
  prerelease: auto
  # The commit list below is close to useless on its own — it says what
  # changed, never what the thing is. Anyone arriving at a release page from
  # a search result sees this first, so it has to stand alone.
  header: |
    Container orchestration over CRI, with service images built straight from
    Nix closures instead of Dockerfiles.

    `nix-compose` speaks CRI gRPC directly to containerd or CRI-O — no daemon,
    no compose file, nothing shelling out to another tool. A service can name a
    *package* instead of a registry image, and its image is built from that
    package's Nix closure and imported into the runtime: no Dockerfile, nothing
    pushed or pulled.

    ## Install

    ```sh
    nix run github:systemstart/nix-compose -- up -d
    # or
    go install github.com/systemstart/nix-compose/cmd/nix-compose@latest
    ```

    Or download an archive below. Linux only; needs containerd or CRI-O.
    Run `nix-compose doctor` first — it checks every prerequisite and each
    finding carries its fix.

    ## Before you adopt it

    Read [docs/limitations.md](https://github.com/systemstart/nix-compose/blob/main/docs/limitations.md)
    — a deliberately complete account of what does not work, not a marketing
    document. The changes in this release are listed below.
  footer: |

    ---

    While the major version is 0, the `nix-compose.yaml` schema and the CLI
    surface may still change between minor releases.

    Archives are attested with build provenance; verify with
    `gh attestation verify <archive> --repo systemstart/nix-compose`.
