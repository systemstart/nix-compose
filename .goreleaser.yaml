version: 2

builds:
  - main: ./cmd/nix-compose
    binary: nix-compose
    ldflags:
      - -X main.version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: ['tar.gz']
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# Release notes are generated by git-cliff (cliff.toml) and passed in with
# --release-notes by `make release`, so goreleaser's own changelog is disabled.
# Its model of a commit is (sha, subject, author) -- it never parses
# conventional-commit footers, so a BREAKING CHANGE description could not reach
# the release page. cliff.toml owns the header and footer too, because
# --release-notes replaces the whole body.
changelog:
  disable: true

release:
  github:
    owner: systemstart
    name: nix-compose
  # "auto" marks a release as a pre-release only when the tag carries a
  # semver pre-release identifier (v0.2.0-rc1). A plain v0.1.0 is a full
  # release; tag an -rc if you want otherwise.
  prerelease: auto
